name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/managed-foundation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint managed package
        run: ruff check tradebot tests
      - name: Run credential-free tests
        run: pytest -m "not postgres"

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradebot
          POSTGRES_PASSWORD: tradebot
          POSTGRES_DB: tradebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://tradebot:tradebot@localhost:5432/tradebot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head twice
        run: |
          alembic upgrade head
          alembic upgrade head
